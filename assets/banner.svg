<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Gleidson Levi, Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#14122b"/>
      <stop offset="1" stop-color="#2a0f1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>

  <circle cx="860" cy="60" r="90" fill="#ff4d4d" opacity="0.22" filter="url(#glow)">
    <animate attributeName="cx" values="860;820;860" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="230" r="80" fill="#6c5ce7" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cy" values="230;200;230" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#6b7394">
    <text x="60" y="62">SELECT</text>
    <text x="125" y="62" fill="#ff9f43">'engineer'</text>
    <text x="215" y="62">FROM</text>
    <text x="262" y="62" fill="#a29bfe">dual</text>
    <text x="305" y="62">;</text>
  </g>

  <text x="60" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff">Gleidson Levi</text>
  <rect x="60" y="154" width="150" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="width" values="40;150;40" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="198" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="22" fill="#c9d1ff">
    Senior Software Engineer
    <tspan fill="#ff6b6b"> · </tspan>
    Oracle PL/SQL
  </text>

  <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="18" fill="#ff9f43">
    <text x="60" y="232">&gt; building data-heavy systems</text>
    <text x="343" y="232">_
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
