<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Gleidson Levi, Tech Lead e Desenvolvedor Back-End">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4f"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a4f" stop-opacity=".9"/><stop offset="1" stop-color="#ffb454" stop-opacity=".55"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ff5a4f" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
    <clipPath id="type"><rect x="60" y="300" width="0" height="34"><animate attributeName="width" values="0;470;470;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1000" height="380" rx="20" fill="#0b0c10"/>
  <rect width="1000" height="380" rx="20" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="379" rx="19.5" fill="none" stroke="#252838"/>

  <g>
    <circle cx="38" cy="36" r="6" fill="#ff5f57"/><circle cx="58" cy="36" r="6" fill="#febc2e"/><circle cx="78" cy="36" r="6" fill="#28c840"/>
    <text x="104" y="40" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="12" fill="#7d8399">levi.sql</text>
  </g>

  <text x="60" y="128" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="14" fill="#ffb454" letter-spacing="3">TECH LEAD · BACK-END</text>
  <text x="58" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" fill="#eceef5" letter-spacing="-2">Gleidson Levi</text>
  <rect x="60" y="226" width="120" height="5" rx="2.5" fill="url(#ac)"/>
  <text x="60" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#7d8399">6+ anos de Oracle, de 9i a 21c. Integrações de ERP,</text>
  <text x="60" y="294" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#7d8399">APIs e engenharia com agentes de IA.</text>

  <g clip-path="url(#type)">
    <text x="60" y="326" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace" font-size="15" fill="#eceef5"><tspan fill="#ff5a4f">SELECT</tspan> experiencia <tspan fill="#ff5a4f">FROM</tspan> levi <tspan fill="#ff5a4f">WHERE</tspan> anos &gt; 6;</text>
  </g>

  <g transform="translate(790 190)">
    <ellipse cx="0" cy="0" rx="190" ry="190" fill="url(#halo)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
      <g fill="url(#disc)" stroke="#0b0c10" stroke-width="2">
        <path d="M-90 40 v52 a90 28 0 0 0 180 0 v-52 z"/>
        <path d="M-90 -22 v52 a90 28 0 0 0 180 0 v-52 z" fill-opacity=".92"/>
        <path d="M-90 -84 v52 a90 28 0 0 0 180 0 v-52 z" fill-opacity=".85"/>
      </g>
      <ellipse cx="0" cy="-84" rx="90" ry="28" fill="#ffb454" stroke="#0b0c10" stroke-width="2"/>
      <ellipse cx="0" cy="-84" rx="60" ry="17" fill="none" stroke="#0b0c10" stroke-opacity=".35"/>
      <g stroke="#0b0c10" stroke-opacity=".45" stroke-width="2" fill="none">
        <path d="M-90 -22 a90 28 0 0 0 180 0"/><path d="M-90 40 a90 28 0 0 0 180 0"/>
      </g>
    </g>
    <circle r="4" fill="#8b7cff"><animateMotion dur="7s" repeatCount="indefinite" path="M-150 0 a150 60 0 1 1 300 0 a150 60 0 1 1 -300 0"/></circle>
    <circle r="3" fill="#ffb454"><animateMotion dur="11s" repeatCount="indefinite" path="M-120 20 a120 90 0 1 0 240 0 a120 90 0 1 0 -240 0"/></circle>
  </g>
</svg>
